<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Quest - Fitness RPG AI Pro</title>
  
  <!-- MediaPipe & Drawing Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0b0c10; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .game-container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 950px; width: 100%; justify-content: center; }

    /* Card RPG */
    .card { background: #1f2833; width: 420px; border-radius: 16px; padding: 20px; border: 1px solid #45a29e; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }

    /* Player HUD */
    .hud { display: flex; align-items: center; background: #0b0c10; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    .level { background: #66fcf1; color: #0b0c10; font-weight: 900; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .hud-info { flex: 1; margin: 0 12px; }
    .bar { background: #1f2833; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }

    /* Boss Display */
    .boss-container { text-align: center; margin: 15px 0; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .boss-img { width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255, 70, 85, 0.5)); transition: transform 0.1s; }
    .boss-name { font-size: 20px; font-weight: 800; color: #66fcf1; margin-top: 10px; letter-spacing: 1px; }

    /* Camera Box */
    .video-container { position: relative; width: 100%; height: 280px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #45a29e; }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; }

    .counter { font-size: 46px; font-weight: 900; text-align: center; margin: 10px 0; font-family: monospace; color: #66fcf1; }
    
    .btn { background: #66fcf1; color: #0b0c10; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { background: #45a29e; }
    .btn-sec { background: #333; color: #fff; margin-top: 8px; }

    .damage-pop { position: absolute; color: #ff4655; font-size: 36px; font-weight: 900; pointer-events: none; animation: floatUp 0.6s ease-out forwards; left: 50%; top: 40%; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -60px); } }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- TELA DE JOGO / BATALHA -->
    <div class="card">
      <div class="hud">
        <div class="level" id="player-lvl">1</div>
        <div class="hud-info">
          <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
            <span>GUERREIRO</span>
            <span id="gold-cnt">🪙 0</span>
          </div>
          <div class="bar"><div class="bar-fill" id="xp-bar" style="background:#66fcf1;"></div></div>
        </div>
      </div>

      <div class="boss-container">
        <img id="boss-img" class="boss-img" src="" alt="Boss">
        <div class="boss-name" id="boss-name">...</div>
      </div>

      <div class="bar" style="height:16px; background:rgba(255,70,85,0.2);"><div class="bar-fill" id="boss-hp-bar" style="background:#ff4655; width:100%;"></div></div>
      <div style="text-align:center; font-size:13px; color:#aaa; margin:5px 0 15px 0;" id="boss-hp-txt">0/0 HP</div>

      <div style="background:#0b0c10; padding:10px; border-radius:8px; font-size:13px; text-align:center;" id="log-txt">Fique em posição de flexão em frente à câmera.</div>
      <button class="btn btn-sec" id="next-btn" onclick="proximoBoss()" style="display:none;">PRÓXIMO INIMIGO ⚔️</button>
    </div>

    <!-- TELA DE CÂMERA E IA -->
    <div class="card">
      <div style="text-align:center; font-weight:bold; margin-bottom:10px; color:#66fcf1;">DETECÇÃO DE EXERCÍCIO COM IA</div>
      
      <div class="video-container">
        <video id="webcam" playsinline></video>
        <canvas id="output_canvas"></canvas>
      </div>

      <div class="counter" id="rep-cnt">0 / 0</div>
      
      <button class="btn" id="cam-btn" onclick="iniciarCamera()">🎥 LIGAR CÂMERA DE TREINO</button>
      <button class="btn btn-sec" onclick="contarRepeticao(true)">+1 REP MANUAL</button>
    </div>
  </div>

  <script>
    // --- LISTA DE BOSSES COM ARTES RPG REALISTAS ---
    const bosses = [
      { name: "ZUMBI SOMBRIO", hp: 10, xp: 40, gold: 15, img: "https://img.icons8.com/isometric/100/zombie.png" },
      { name: "ESQUELETO RECRUTA", hp: 20, xp: 70, gold: 30, img: "https://img.icons8.com/isometric/100/skeleton.png" },
      { name: "GOBLIN GUERREIRO", hp: 35, xp: 120, gold: 50, img: "https://img.icons8.com/isometric/100/goblin.png" },
      { name: "ORC CHEFE", hp: 60, xp: 200, gold: 100, img: "https://img.icons8.com/isometric/100/orc.png" },
      { name: "DRAGÃO DE FOGO", hp: 100, xp: 500, gold: 300, img: "https://img.icons8.com/isometric/100/dragon.png" }
    ];

    let bIndex = 0, lvl = 1, xp = 0, maxXp = 100, gold = 0;
    let bHp = bosses[0].hp, reps = 0, defeated = false;

    function atualizarHUD() {
      const b = bosses[bIndex];
      document.getElementById('boss-name').innerText = b.name;
      document.getElementById('boss-img').src = b.img;
      document.getElementById('boss-hp-bar').style.width = (bHp / b.hp * 100) + '%';
      document.getElementById('boss-hp-txt').innerText = `${bHp} / ${b.hp} HP`;
      document.getElementById('rep-cnt').innerText = `${reps} / ${b.hp}`;
      document.getElementById('player-lvl').innerText = lvl;
      document.getElementById('xp-bar').style.width = (xp / maxXp * 100) + '%';
      document.getElementById('gold-cnt').innerText = `🪙 ${gold}`;
    }

    function contarRepeticao(manual = false) {
      if (defeated) return;
      reps++;
      bHp--;
      
      // Animação de dano no Boss
      const img = document.getElementById('boss-img');
      img.style.transform = 'scale(1.2) rotate(5deg)';
      setTimeout(() => img.style.transform = 'scale(1)', 100);

      mostrarPopUp("-1 HP");

      if (bHp <= 0) {
        bHp = 0;
        defeated = true;
        gold += bosses[bIndex].gold;
        xp += bosses[bIndex].xp;
        if (xp >= maxXp) { lvl++; xp -= maxXp; maxXp = Math.floor(maxXp * 1.5); }
        document.getElementById('log-txt').innerText = `🏆 INIMIGO DERROTADO! +${bosses[bIndex].xp} XP / +${bosses[bIndex].gold} Moedas!`;
        document.getElementById('next-btn').style.display = 'block';
      }
      atualizarHUD();
    }

    function mostrarPopUp(txt) {
      const p = document.createElement('div');
      p.className = 'damage-pop';
      p.innerText = txt;
      document.querySelector('.card').appendChild(p);
      setTimeout(() => p.remove(), 600);
    }

    function proximoBoss() {
      if (bIndex < bosses.length - 1) bIndex++;
      bHp = bosses[bIndex].hp; reps = 0; defeated = false;
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('log-txt').innerText = "Em combate!";
      atualizarHUD();
    }

    // --- DETECÇÃO DE VISÃO COMPUTACIONAL COM FILTRO ANTI-BUG E ESQUELETO VISUAL ---
    let estadoMovimento = "SUBIDA";
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');

    function calcAngulo(a, b, c) {
      let rad = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let ang = Math.abs(rad * 180.0 / Math.PI);
      return ang > 180.0 ? 360.0 - ang : ang;
    }

    function processarPose(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        // 1. Desenha as "linhas" do esqueleto na tela
        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#66fcf1', lineWidth: 3 });
        drawLandmarks(ctx, results.poseLandmarks, { color: '#ff4655', lineWidth: 2, radius: 4 });

        // 2. Extrai articulações do braço e tronco
        let ombro = results.poseLandmarks[11];
        let cotovelo = results.poseLandmarks[13];
        let pulso = results.poseLandmarks[15];
        let quadril = results.poseLandmarks[23];

        if (ombro && cotovelo && pulso && quadril) {
          let angCotovelo = calcAngulo(ombro, cotovelo, pulso);
          
          // FILTRO ANTI-BUG: Valida se o ombro e o quadril estão no mesmo plano horizontal (posição de prancha/flexão)
          let corpoHorizontal = Math.abs(ombro.y - quadril.y) < 0.25;

          if (corpoHorizontal) {
            // Flexão válida: Descida (cotovelo dobrado < 95º)
            if (angCotovelo < 95 && estadoMovimento === "SUBIDA") {
              estadoMovimento = "DESCIDA";
            }
            // Flexão válida: Subida completada (braço esticado > 155º)
            if (angCotovelo > 155 && estadoMovimento === "DESCIDA") {
              estadoMovimento = "SUBIDA";
              contarRepeticao(); // Dispara o golpe real
            }
          }
        }
      }
      ctx.restore();
    }

    function iniciarCamera() {
      document.getElementById('cam-btn').style.display = 'none';
      const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
      pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
      pose.onResults(processarPose);

      const cam = new Camera(video, {
        onFrame: async () => { 
          canvas.width = video.videoWidth || 400;
          canvas.height = video.videoHeight || 300;
          await pose.send({ image: video }); 
        },
        width: 400, height: 300
      });
      cam.start();
    }

    atualizarHUD();
  </script>
</body>
</html>
